name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the suite can be run against the live endpoint on demand, without pushing.
  workflow_dispatch:
  # The end-to-end suite writes to the live record store on every run, and the
  # free allowance is finite - it was spent once already, which suspended the
  # store mid-week. Once a day plus on demand is the same signal at a fraction
  # of the cost.
  schedule:
    - cron: '0 6 * * *'

# A second push should not race the first through the same live record store.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node --test runs the .ts suites directly through Node's type
          # stripping, which needs a recent runtime. 24 is the newest LTS line
          # the runners provide.
          node-version: '24'
          cache: npm

      # CI installs a clean tree on purpose. Note that the local checkout carries
      # a hand-patched @dcl/sdk-commands linker (see README); that patch only
      # affects `npm run deploy`, never the build, so its absence here is correct.
      - run: npm ci

      - name: Formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Production build and type check
        run: npx sdk-commands build --production

      - name: Unit, contract and readability tests
        run: npm test

      - name: Scene stays inside the mobile budget
        run: node scripts/scene-budget.mjs

      # The audio the world ships is generated, not hand-made, so the committed
      # file must be exactly what the generator produces. A drift here means
      # someone edited the asset instead of the source of the asset.
      - name: The shipped audio still matches its generator
        run: |
          npm run sound
          git diff --exit-code sounds/

  e2e:
    name: End-to-end against the live endpoint
    # Never on a push. See the schedule above: this suite costs real store
    # operations, so it runs on a timer and when somebody asks for it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # The deployed-world project is deliberately excluded: it asserts things
      # about the live World that are only true after a deploy, and CI does not
      # deploy. `npm run verify` is what runs it.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
